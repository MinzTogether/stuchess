name: Build stuchess APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'Android-v*'
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build bot engine binaries (arm64-v8a & armeabi-v7a)
        run: |
          chmod +x scripts/build_stockfish_android.sh
          chmod +x stockfish-src/scripts/net.sh 2>/dev/null || true

          CUSTOM_ARCHIVE="$(find bot-sources -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' -o -name '*.rar' \) 2>/dev/null | head -n 1 || true)"

          if [ -n "$CUSTOM_ARCHIVE" ]; then
            ./scripts/build_stockfish_android.sh "$CUSTOM_ARCHIVE"
          else
            ./scripts/build_stockfish_android.sh stockfish-src/src
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build Release APKs (armeabi-v7a, arm64-v8a, universal)
        run: gradle assembleRelease

      - name: Sign and package Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          for var in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Error: Missing required signing secret ($var)." >&2
              exit 1
            fi
          done

          SIGN_TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$SIGN_TMP_DIR"' EXIT

          KEYSTORE_PATH="$SIGN_TMP_DIR/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(ls -1d "$SDK_DIR/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "Error: Android SDK build-tools (zipalign/apksigner) not found under $SDK_DIR." >&2
            exit 1
          fi

          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          mkdir -p dist

          sign_apk() {
            local abi_tag="$1"
            local out_name="$2"
            local unsigned_apk="app/build/outputs/apk/release/app-${abi_tag}-release-unsigned.apk"
            local signed_default_apk="app/build/outputs/apk/release/app-${abi_tag}-release.apk"
            local src_apk=""

            if [ -f "$unsigned_apk" ]; then
              src_apk="$unsigned_apk"
            elif [ -f "$signed_default_apk" ]; then
              src_apk="$signed_default_apk"
            else
              echo "Error: Release APK for $abi_tag not found." >&2
              exit 1
            fi

            local aligned_apk="$SIGN_TMP_DIR/${out_name}.aligned.apk"
            local out_apk="dist/${out_name}"

            "$ZIPALIGN" -f -p 4 "$src_apk" "$aligned_apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$out_apk" \
              "$aligned_apk"
            "$APKSIGNER" verify "$out_apk"
            test -s "$out_apk"
          }

          sign_apk "armeabi-v7a" "stuchess_v7a.apk"
          sign_apk "arm64-v8a" "stuchess_v8a.apk"
          sign_apk "universal" "stuchess_universal.apk"

          ls -lh dist/stuchess_*.apk

      - name: Upload stuchess APK zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: stuchess-apks
          path: dist/stuchess_*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: stuchess ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/stuchess_v7a.apk
            dist/stuchess_v8a.apk
            dist/stuchess_universal.apk
